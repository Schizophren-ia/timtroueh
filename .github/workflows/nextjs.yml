name: Build Vinext and publish demo link

on:
  push:
    branches: [main]
    paths-ignore:
      - plan.md
      - README.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --include=optional --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test backend
        run: npm test
      - name: Build with Vinext
        run: npm run build
      - name: Upload application build
        uses: actions/upload-artifact@v4
        with:
          name: timtroueh-worker-build
          path: dist/
          include-hidden-files: true
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare public demo link
        run: |
          mkdir -p .pages
          cp pages/index.html .pages/index.html
          cp pages/index.html .pages/404.html
          touch .pages/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
      - name: Deploy demo link to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
